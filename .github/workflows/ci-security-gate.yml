name: EPA Punjab Security & Integrity Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-verification:
    name: Security & Architecture Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Dependency Vulnerability Audit (T-03)
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Complete Jest Security & Integrity Suite (T-02)
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: "test_ci_secure_jwt_secret_key_minimum_32_chars!"
        run: npm test

      - name: Setup Python for E2E Tests (T-04)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Playwright Dependencies
        run: |
          pip install -r requirements-e2e.txt
          playwright install --with-deps chromium
