version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: epa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: epa_social_dashboard
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: epa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/epa_social_dashboard?schema=public"
      JWT_SECRET: "${JWT_SECRET:-EPA_PUNJAB_SECURE_PRODUCTION_JWT_SECRET_KEY_2026_CHANGE_ME}"
      HOST: "0.0.0.0"
      PORT: 8080
      NODE_ENV: production
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    driver: local
